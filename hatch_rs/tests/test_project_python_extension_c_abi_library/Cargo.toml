[package]
name = "c_abi_bundle_extension_py"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "c_abi_bundle_extension"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
c_abi_library = { path = "rust", optional = true }

[features]
default = ["direct"]
capi = []
direct = ["dep:c_abi_library"]

[profile.release]
panic = "abort"
