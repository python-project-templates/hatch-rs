[package]
name = "build_script_header"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"

[lib]
name = "build_script_header"
path = "src/lib.rs"
crate-type = ["cdylib"]

[build-dependencies]
cbindgen = { version = "0.29", default-features = false }

[profile.release]
panic = "abort"
