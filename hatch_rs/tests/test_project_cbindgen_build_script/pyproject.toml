[build-system]
requires = ["hatchling>=1.20"]
build-backend = "hatchling.build"

[project]
name = "hatch-rs-test-project-cbindgen-build-script"
description = "cbindgen build-script header test project for hatch-rs"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "hatchling>=1.20",
    "hatch-rs",
]

[tool.hatch.build]
artifacts = [
    "build_script_project/include/*.h",
    "build_script_project/lib/*.dll",
    "build_script_project/lib/*.dylib",
    "build_script_project/lib/*.so",
]

[tool.hatch.build.sources]
src = "/"

[tool.hatch.build.targets.sdist]
packages = ["build_script_project"]

[tool.hatch.build.targets.wheel]
packages = ["build_script_project"]

[tool.hatch.build.hooks.hatch-rs]
verbose = true
path = "."
module = "build_script_project"
target-dir = "isolated"

[[tool.hatch.build.hooks.hatch-rs.artifacts]]
name = "build_script_header"
manifest = "Cargo.toml"
destination = "build_script_project/lib/{shared_library}"
expected-headers = ["build_script_project/include/build_script_header.h"]
header-symbol-prefix = "build_script_header_"
expected-abi-strings = ["BUILD_SCRIPT_HEADER_ABI_VERSION"]
